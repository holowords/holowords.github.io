<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Words — holo words</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="words">
  <nav class="site-nav">
    <div class="site-nav__links">
      <a href="index.html#about" data-nav="about" id="nav-holo-words">holo words</a>
      <a href="index.html#about-intro" data-nav="about" id="nav-about">about</a>
      <a href="words.html" data-nav="words">words</a>
      <a href="index.html#work" data-nav="work">work</a>
      <a href="book.html" data-nav="book">book</a>
      <a href="index.html#bookcase" data-nav="bookcase">book case</a>
    </div>
  </nav>

  <div class="nav-search-wrap">
    <form class="nav-search" id="search-box" autocomplete="off">
      <input type="text" id="search-input" class="nav-search__input" placeholder="당신의 단어를 입력해 보세요." />
      <button type="submit" class="nav-search__button">검색</button>
    </form>
    <span class="nav-search__count" id="word-count"></span>
  </div>

  <main class="words-page" id="words-page">
    <div class="page-info" id="words-info">
      <button
        class="page-info__toggle"
        id="words-intro-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="words-info-panel"
        aria-label="설명 보기"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9" />
          <line x1="12" y1="11" x2="12" y2="16.5" />
          <circle cx="12" cy="7.5" r="1" fill="currentColor" stroke="none" />
        </svg>
      </button>
      <p class="page-info__panel" id="words-info-panel">
        어느 계절, 출근길에 전자책을 읽다가 마음에 와닿은 문장들입니다.<br />
        다정한 말 한마디에 마음이 녹기도 하고, 찌르듯 아픈 말에 속이 상하기도 합니다.<br />
        그 모든 말들이 위로가 되어 삶을 지탱해줍니다. 보기만 해도 힘이 되는 말이 있으신가요?
      </p>
    </div>
    <div class="words-tabs" id="words-tabs">
      <button class="words-tab active" type="button" data-tab="all">전체단어</button>
      <button class="words-tab" type="button" data-tab="search">키워드로 찾기</button>
    </div>

    <div class="words-panel-view" id="words-tab-all">
      <div class="words-view words-view--index" id="words-view-index">
        <nav class="words-index" id="words-index"></nav>
        <div class="words-index-content" id="words-index-content"></div>
      </div>
    </div>

    <div class="words-panel-view" id="words-tab-search" hidden>
      <p class="words-search-banner" id="keyword-summary"></p>
      <div class="words-view words-view--index">
        <nav class="words-index" id="keyword-index"></nav>
        <div class="words-index-content">
          <div class="keyword-cloud" id="keyword-cloud"></div>
          <div class="keyword-results" id="keyword-results">
            <p class="words-placeholder">키워드를 선택해보세요.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="word-panel-overlay" id="word-panel-overlay"></div>
  <aside class="word-panel" id="word-panel">
    <button class="word-panel__close" id="word-panel-close" aria-label="닫기">✕</button>
    <div class="word-panel__title" id="word-panel-title"></div>
    <div class="word-panel__byline" id="word-panel-byline"></div>
    <div class="word-panel__body" id="word-panel-body"></div>
  </aside>

  <script src="js/words-data.js"></script>
  <script src="js/words-keywords.js"></script>
  <script src="js/drive-config.js"></script>
  <script src="js/drive-words.js"></script>
  <script src="js/words.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
