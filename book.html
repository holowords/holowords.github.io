<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book — holo words</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="book">
  <nav class="site-nav">
    <div class="site-nav__links">
      <a href="index.html#about" data-nav="about" id="nav-holo-words">holo words</a>
      <a href="index.html#about-intro" data-nav="about" id="nav-about">about</a>
      <a href="words.html" data-nav="words">words</a>
      <a href="index.html#work" data-nav="work">work</a>
      <a href="book.html" data-nav="book">book</a>
      <a href="index.html#bookcase" data-nav="bookcase">book case</a>
    </div>
  </nav>

  <div class="nav-search-wrap">
    <form class="nav-search" id="search-box" autocomplete="off">
      <input type="text" id="search-input" class="nav-search__input" placeholder="당신의 단어를 입력해 보세요." />
      <button type="submit" class="nav-search__button">검색</button>
    </form>
    <span class="nav-search__count" id="word-count"></span>
  </div>

  <div class="book-page">
    <button class="book-cover-launch" id="book-cover-launch" type="button">
      <img src="image/Book/책커버_2.png" alt="오늘의 단어 — 하나·두울·셋" />
      <span class="book-cover-launch__label">클릭하면 책이 펼쳐집니다 →</span>
    </button>

    <div class="book-viewer" id="book-viewer">
      <nav class="book-index" id="book-index" aria-label="페이지 바로가기"></nav>
      <button class="book-index__more" id="book-index-more" type="button" aria-label="더보기">⌄</button>

      <div class="book-stage">
        <button class="book-nav book-nav--prev" id="book-prev" type="button" aria-label="이전 페이지">‹</button>

        <div class="book-frame" id="book-frame">
          <div class="book-frame__clip" id="book-frame-clip">
            <div id="book-flip"></div>
          </div>
          <div class="book-frame__mask book-frame__mask--left" id="book-mask-left"></div>
          <div class="book-frame__mask book-frame__mask--right" id="book-mask-right"></div>
        </div>

        <button class="book-nav book-nav--next" id="book-next" type="button" aria-label="다음 페이지">›</button>
      </div>

      <div class="book-footer">
        <button class="book-progress" id="book-progress" type="button" title="페이지 이동"></button>
        <form class="book-progress-form" id="book-progress-form" hidden>
          <input type="number" id="book-progress-input" min="1" inputmode="numeric" />
          <span id="book-progress-total"></span>
        </form>
        <button class="book-reset" id="book-reset" type="button">처음으로</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script src="js/book-data.js"></script>
  <script src="js/book.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/drive-config.js"></script>
  <script src="js/drive-words.js"></script>
  <script>
    (async () => {
      const searchForm = document.getElementById("search-box");
      const searchInput = document.getElementById("search-input");
      const wordCount = document.getElementById("word-count");

      searchForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const q = searchInput.value.trim();
        location.href = q ? `words.html?q=${encodeURIComponent(q)}` : "words.html";
      });

      try {
        const words = await fetchDriveWords();
        wordCount.textContent = `총 ${words.length}개`;
      } catch (err) {
        console.error(err);
      }
    })();
  </script>
</body>
</html>
