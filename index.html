<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>holo words</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Manrope:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="home">
  <nav class="site-nav">
    <div class="site-nav__links">
      <a href="#about" data-nav="about">About</a>
      <a href="words.html" data-nav="words">Words</a>
      <a href="#work" data-nav="work">Work</a>
      <a href="book.html" data-nav="book">Book</a>
      <a href="#contact" data-nav="contact">Contact</a>
    </div>
  </nav>

  <div class="nav-search-wrap">
    <form class="nav-search" id="search-box" autocomplete="off">
      <input type="text" id="search-input" class="nav-search__input" placeholder="당신의 단어를 입력해 보세요." />
      <button type="submit" class="nav-search__button">검색</button>
    </form>
    <span class="nav-search__count" id="word-count"></span>
  </div>

  <div class="hero-slides">
    <section id="about">
      <div>
        <h1 class="identity-mark" id="identity-mark">holowords</h1>
        <p class="identity-sub" id="identity-sub">홀로둥이의 단어</p>
      </div>
    </section>

    <section id="intro">
      <div class="intro__content" id="intro-content">
        <p class="intro__mark">h&nbsp;o&nbsp;l&nbsp;o&nbsp;&nbsp;w&nbsp;o&nbsp;r&nbsp;d&nbsp;s</p>

        <span class="intro__chip intro__chip--title">홀로둥이의 단어</span>

        <div class="intro__lead">
          <span class="intro__chip">세상에</span>
          <span class="intro__chip">발</span>
          <span class="intro__chip">붙이고</span>
          <span class="intro__chip">살아가는</span>
          <span class="intro__chip">모든</span>
          <span class="intro__chip intro__chip--highlight">홀로둥이</span>
          <span class="intro__chip">를</span>
          <span class="intro__chip">응원합니다.</span>
        </div>

        <div class="intro__body">
          <div class="intro__body-lines">
            <p class="intro__chip intro__chip--line">안녕하세요. 홀로둥이의 단어에 오신 걸 환영합니다.</p>
            <p class="intro__chip intro__chip--line">이곳은 개인적으로 수집한 단어들을 모아둔 공간입니다.</p>
          </div>
          <div class="intro__note">
            <p class="intro__note-title">holo words</p>
            <p>'홀로 월드'란 홀로둥이들의 단어,<br />그리고 저마다의 세상을 존중한다는 의미입니다.</p>
          </div>
        </div>

        <p class="intro__chip intro__chip--question">당신을 지탱해주는 단어는 무엇인가요?</p>
      </div>
    </section>
  </div>

  <section id="work">
    <div class="work-grid" id="work-grid"></div>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <p>hello@holowords.com</p>
  </section>

  <script>
    (() => {
      /* Each intro fragment fades/slides in on its own the moment it scrolls
         into view, in source order, instead of the whole block at once. */
      const revealEls = document.querySelectorAll(
        "#intro .intro__mark, #intro .intro__chip, #intro .intro__note"
      );
      const revealObserver = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            entry.target.classList.add("in-view");
            revealObserver.unobserve(entry.target);
          });
        },
        { threshold: 0.2 }
      );
      revealEls.forEach((el) => revealObserver.observe(el));
    })();
  </script>
  <script>
    (() => {
      function typeText(el, text, speed, onDone) {
        const chars = Array.from(text);
        el.textContent = "";
        el.classList.add("typing");

        let i = 0;
        const timer = setInterval(() => {
          el.textContent += chars[i];
          i++;
          if (i >= chars.length) {
            clearInterval(timer);
            el.classList.remove("typing");
            if (onDone) onDone();
          }
        }, speed);
      }

      const mark = document.getElementById("identity-mark");
      const sub = document.getElementById("identity-sub");
      const subText = sub.textContent;
      sub.textContent = "";

      typeText(mark, mark.textContent, 220, () => {
        typeText(sub, subText, 120);
      });
    })();
  </script>
  <script src="js/work-data.js"></script>
  <script src="js/drive-config.js"></script>
  <script src="js/drive-words.js"></script>
  <script>
    (async () => {
      const grid = document.getElementById("work-grid");
      const searchForm = document.getElementById("search-box");
      const searchInput = document.getElementById("search-input");
      const wordCount = document.getElementById("word-count");

      searchForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const q = searchInput.value.trim();
        location.href = q ? `words.html?q=${encodeURIComponent(q)}` : "words.html";
      });

      let words = [];
      try {
        words = await fetchDriveWords();
        wordCount.textContent = `총 ${words.length}개`;
      } catch (err) {
        console.error(err);
      }

      const titleEls = [];

      WORK_ITEMS.forEach((item, i) => {
        const card = document.createElement("a");
        card.className = "work-card";
        card.href = `work.html?id=${item.id}`;
        card.style.backgroundColor = item.bg;
        card.style.color = item.color;

        const wordTitle = words[i] && words[i].title;
        if (wordTitle) {
          const title = document.createElement("span");
          title.className = "work-card__title";
          title.textContent = wordTitle;
          card.appendChild(title);
          titleEls.push(title);
        }

        grid.appendChild(card);
      });

      // Keep card titles alive: each one periodically flips to a fresh random
      // word from the Drive list, staggered per card so they don't flip in sync.
      if (words.length > 1) {
        titleEls.forEach((el) => {
          setInterval(() => {
            const random = words[Math.floor(Math.random() * words.length)].title;
            el.classList.add("work-card__title--fade");
            setTimeout(() => {
              el.textContent = random;
              el.classList.remove("work-card__title--fade");
            }, 200);
          }, 2500 + Math.random() * 3000);
        });
      }
    })();
  </script>
  <script src="js/nav.js"></script>
</body>
</html>
