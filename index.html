<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Manrope:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="home">
  <nav class="site-nav">
    <div class="site-nav__links">
      <a href="#about" data-nav="about">About</a>
      <a href="words.html" data-nav="words">Words</a>
      <a href="#work" data-nav="work">Work</a>
      <a href="book.html" data-nav="book">Book</a>
      <a href="#contact" data-nav="contact">Contact</a>
    </div>
  </nav>

  <div class="nav-search-wrap">
    <form class="nav-search" id="search-box" autocomplete="off">
      <input type="text" id="search-input" class="nav-search__input" placeholder="당신의 단어를 입력해 보세요." />
      <button type="submit" class="nav-search__button">검색</button>
    </form>
    <span class="nav-search__count" id="word-count"></span>
  </div>

  <section id="about">
    <div>
      <h1 class="identity-mark" id="identity-mark">holowords</h1>
      <p class="identity-sub" id="identity-sub">홀로둥이의 단어</p>
    </div>
  </section>

  <section id="work">
    <div class="works-wall" id="works-wall"></div>
  </section>

  <div class="works-lightbox" id="works-lightbox">
    <div class="works-lightbox__frame">
      <img class="works-lightbox__img" id="works-lightbox-img" src="" alt="" />
    </div>
  </div>

  <section id="contact">
    <h2>Contact</h2>
    <p>hello@holowords.com</p>
  </section>

  <script>
    (() => {
      function typeText(el, text, speed, onDone) {
        const chars = Array.from(text);
        el.textContent = "";
        el.classList.add("typing");

        let i = 0;
        const timer = setInterval(() => {
          el.textContent += chars[i];
          i++;
          if (i >= chars.length) {
            clearInterval(timer);
            el.classList.remove("typing");
            if (onDone) onDone();
          }
        }, speed);
      }

      const mark = document.getElementById("identity-mark");
      const sub = document.getElementById("identity-sub");
      const subText = sub.textContent;
      sub.textContent = "";

      typeText(mark, mark.textContent, 220, () => {
        typeText(sub, subText, 120);
      });
    })();
  </script>
  <script src="js/works-data.js"></script>
  <script>
    (() => {
      /* Per-note tilt/offset, seeded by position within the (freshly
         shuffled) render order below. */
      function seededRandom(seed) {
        const x = Math.sin(seed * 9973) * 43758.5453;
        return x - Math.floor(x);
      }

      /* Fisher-Yates: a new scatter of notes on every load. */
      function shuffle(arr) {
        const result = arr.slice();
        for (let i = result.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [result[i], result[j]] = [result[j], result[i]];
        }
        return result;
      }

      const wall = document.getElementById("works-wall");
      const lightbox = document.getElementById("works-lightbox");
      const lightboxImg = document.getElementById("works-lightbox-img");

      function openLightbox(src, alt) {
        lightboxImg.src = src;
        lightboxImg.alt = alt;
        lightbox.classList.add("active");
        document.body.classList.add("lightbox-open");
      }

      function closeLightbox() {
        lightbox.classList.remove("active");
        document.body.classList.remove("lightbox-open");
      }

      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) closeLightbox();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeLightbox();
      });

      shuffle(WORKS_ITEMS).forEach((filename, i) => {
        const note = document.createElement("div");
        note.className = "works-note";
        const tilt = (seededRandom(i + 1) - 0.5) * 12;
        note.style.setProperty("--tilt", `${tilt.toFixed(2)}deg`);

        const img = document.createElement("img");
        const src = `image/works/${encodeURIComponent(filename)}`;
        const alt = filename.replace(/^메모지_/, "").replace(/\.jpg$/i, "");
        img.src = src;
        img.alt = alt;
        img.loading = "lazy";

        note.appendChild(img);
        note.addEventListener("click", () => openLightbox(src, alt));
        wall.appendChild(note);
      });
    })();
  </script>
  <script src="js/drive-config.js"></script>
  <script src="js/drive-words.js"></script>
  <script>
    (async () => {
      const searchForm = document.getElementById("search-box");
      const searchInput = document.getElementById("search-input");
      const wordCount = document.getElementById("word-count");

      searchForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const q = searchInput.value.trim();
        location.href = q ? `words.html?q=${encodeURIComponent(q)}` : "words.html";
      });

      try {
        const words = await fetchDriveWords();
        wordCount.textContent = `총 ${words.length}개`;
      } catch (err) {
        console.error(err);
      }
    })();
  </script>
  <script src="js/nav.js"></script>
</body>
</html>
